<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Opportunities & campus communities — TinkerHub</title>
<meta name="description" content="TinkerHub is a free, student-run learning community in Kerala where students learn tech by building real projects together.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Instrument+Sans:wght@400..700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FAF7F0}
a{color:inherit;text-decoration:none}
a:hover{opacity:.86}
input::placeholder,textarea::placeholder{color:#77716A}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #2346C8;outline-offset:3px}
.tv-tick{animation:tvtick 46s linear infinite}
@keyframes tvtick{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (prefers-reduced-motion: reduce){.tv-tick{animation:none}}
</style>
<script src="vendor/preact.umd.js"></script>
<script src="vendor/three.min.js"></script>
<script src="js/tinker-runtime.js"></script>
</head>
<body>
<div id="app"></div>
<template id="page">
<div style="font-family: 'Instrument Sans', system-ui, -apple-system, 'Segoe UI', sans-serif; color: #111111; background: #FAF7F0; width: 100%; overflow: hidden; font-size: 17px; line-height: 1.55">
<header style="background: #FAF7F0; border-bottom: 2px solid #111111">
<div style="background: #111111; color: #FAF7F0; overflow: hidden; border-bottom: 2px solid #111111">
<div class="tv-tick" aria-hidden="true" style="display: flex; width: max-content; padding: 7px 0; font-family: 'Instrument Sans', system-ui, sans-serif; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase"><span style="padding: 0 28px">New events every week at TinkerSpace Kochi &amp; Kozhikode</span><span style="padding: 0 28px; color: {{accent}}">✦</span><span style="padding: 0 28px">72 campus communities across 13 districts</span><span style="padding: 0 28px; color: {{accent}}">✦</span><span style="padding: 0 28px">Free for students</span><span style="padding: 0 28px; color: {{accent}}">✦</span><span style="padding: 0 28px">Be kind · Get involved · Make a change</span><span style="padding: 0 28px; color: {{accent}}">✦</span><span style="padding: 0 28px">New events every week at TinkerSpace Kochi &amp; Kozhikode</span><span style="padding: 0 28px; color: {{accent}}">✦</span><span style="padding: 0 28px">72 campus communities across 13 districts</span><span style="padding: 0 28px; color: {{accent}}">✦</span><span style="padding: 0 28px">Free for students</span><span style="padding: 0 28px; color: {{accent}}">✦</span><span style="padding: 0 28px">Be kind · Get involved · Make a change</span><span style="padding: 0 28px; color: {{accent}}">✦</span></div>
</div>
<nav aria-label="Primary" style="max-width: 1280px; margin: 0 auto; padding-left: clamp(20px, 4vw, 56px); padding-right: clamp(20px, 4vw, 56px); box-sizing: border-box; padding-top: 14px; padding-bottom: 14px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 28px">
<a href="index.html" style="display: flex; align-items: baseline; gap: 8px">
<span style="font-family: 'Bricolage Grotesque', 'Instrument Sans', system-ui, sans-serif; font-weight: 800; font-size: 34px; line-height: 1; letter-spacing: -0.02em">tinkerhub</span>
<span style="font-family: 'Instrument Sans', system-ui, sans-serif; font-size: 11px; color: #4B4740">foundation</span>
</a>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px 22px; font-weight: 600; font-size: 15px">
<a href="programs.html" style="padding: 6px 2px; border-bottom: 2px solid transparent">Programs</a>
<a href="events-community.html" aria-current="page" style="padding: 6px 2px; border-bottom: 2px solid #111111">Events &amp; Community</a>
<a href="impact.html" style="padding: 6px 2px; border-bottom: 2px solid transparent">Impact</a>
<a href="reports.html" style="padding: 6px 2px; border-bottom: 2px solid transparent">Reports</a>
<a href="partner.html" style="padding: 6px 2px; border-bottom: 2px solid transparent">Partner with us</a>
<a href="events-community.html" style="background: #111111; color: #FAF7F0; padding: 0 18px; min-height: 44px; display: inline-flex; align-items: center; border-radius: 14px">Get involved →</a>
</div>
</nav>
</header>
<!-- HEADER -->
<section style="background-color: #FFF1DC; border-bottom: 2px solid #111111">
<div style="max-width: 1280px; margin: 0 auto; padding-left: clamp(20px, 4vw, 56px); padding-right: clamp(20px, 4vw, 56px); box-sizing: border-box; padding-top: clamp(48px, 6vw, 96px); padding-bottom: clamp(32px, 4vw, 56px); display: flex; flex-direction: column; gap: 22px">
<div style="display: flex; gap: 14px"><span style="font-family: 'Instrument Sans', system-ui, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #4B4740">Opportunities</span>
</div>
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', 'Instrument Sans', system-ui, sans-serif; font-weight: 800; font-size: clamp(52px, 7.4vw, 116px); line-height: 0.95; letter-spacing: -0.04em">Find your next thing to <em style="font-style: normal; background: #FFD23F; color: #111111; padding: 0 0.18em; border-radius: 0.18em; box-decoration-break: clone; -webkit-box-decoration-break: clone">build.</em></h1>
<p style="margin: 0; font-size: 19px; line-height: 1.6; color: #2C2925; max-width: 720px">Events, programs, fellowships and roles shared through TinkerHub. Most events are free. Anything past its date moves to Closed automatically, so what you see as open is still open.</p>
</div>
</section>

<!-- E · OPPORTUNITY FINDER -->
<section style="background: #FAF7F0; border-bottom: 2px solid #111111">
<div style="max-width: 1280px; margin: 0 auto; padding-left: clamp(20px, 4vw, 56px); padding-right: clamp(20px, 4vw, 56px); box-sizing: border-box; padding-top: clamp(40px, 5vw, 64px); padding-bottom: clamp(56px, 7vw, 96px); display: flex; flex-wrap: wrap; gap: 32px">
<div style="flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 22px">
<label style="display: flex; flex-direction: column; gap: 8px">
<span style="font-family: 'Instrument Sans', system-ui, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #4B4740">Search</span>
<input type="search" value="{{q}}" onInput="{{onQ}}" placeholder="FreeCAD, firmware, fellowship…" style="font-family: inherit; font-size: 17px; color: #111111; background: #FFFFFF; border: 2px solid #111111; border-radius: 14px; padding: 0 16px; min-height: 50px; box-sizing: border-box; width: 100%">
</label>
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-family: 'Instrument Sans', system-ui, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #4B4740">Status</span>
<div role="group" aria-label="Status" style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{statusChips}}" as="sc" hint-placeholder-count="4">
<sc-if value="{{sc.on}}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{sc.pick}}" aria-pressed="true" style="font-family: inherit; cursor: pointer; min-height: 40px; padding: 0 14px; border-radius: 999px; border: 2px solid #111111; background: #111111; color: #FAF7F0; font-weight: 600; font-size: 14px">{{sc.label}}</button></sc-if>
<sc-if value="{{sc.off}}" hint-placeholder-val="{{ true }}"><button type="button" onClick="{{sc.pick}}" aria-pressed="false" style="font-family: inherit; cursor: pointer; min-height: 40px; padding: 0 14px; border-radius: 999px; border: 2px solid #111111; background: transparent; color: #111111; font-weight: 600; font-size: 14px">{{sc.label}}</button></sc-if>
</sc-for>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-family: 'Instrument Sans', system-ui, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #4B4740">Track</span>
<div role="group" aria-label="Track" style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{typeChips}}" as="tc" hint-placeholder-count="4">
<sc-if value="{{tc.on}}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{tc.pick}}" aria-pressed="true" style="font-family: inherit; cursor: pointer; min-height: 40px; padding: 0 14px; border-radius: 999px; border: 2px solid #111111; background: #111111; color: #FAF7F0; font-weight: 600; font-size: 14px">{{tc.label}}</button></sc-if>
<sc-if value="{{tc.off}}" hint-placeholder-val="{{ true }}"><button type="button" onClick="{{tc.pick}}" aria-pressed="false" style="font-family: inherit; cursor: pointer; min-height: 40px; padding: 0 14px; border-radius: 999px; border: 2px solid #111111; background: transparent; color: #111111; font-weight: 600; font-size: 14px">{{tc.label}}</button></sc-if>
</sc-for>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-family: 'Instrument Sans', system-ui, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #4B4740">Where</span>
<div role="group" aria-label="Where" style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{cityChips}}" as="cc" hint-placeholder-count="4">
<sc-if value="{{cc.on}}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{cc.pick}}" aria-pressed="true" style="font-family: inherit; cursor: pointer; min-height: 40px; padding: 0 14px; border-radius: 999px; border: 2px solid #111111; background: #111111; color: #FAF7F0; font-weight: 600; font-size: 14px">{{cc.label}}</button></sc-if>
<sc-if value="{{cc.off}}" hint-placeholder-val="{{ true }}"><button type="button" onClick="{{cc.pick}}" aria-pressed="false" style="font-family: inherit; cursor: pointer; min-height: 40px; padding: 0 14px; border-radius: 999px; border: 2px solid #111111; background: transparent; color: #111111; font-weight: 600; font-size: 14px">{{cc.label}}</button></sc-if>
</sc-for>
</div>
</div>
</div>
<div style="flex: 999 1 620px; min-width: 0; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap">
<h3 style="margin: 0; font-family: 'Bricolage Grotesque', 'Instrument Sans', system-ui, sans-serif; font-weight: 800; font-size: 34px; line-height: 1.05; letter-spacing: -0.02em; color: #111111">{{resultTitle}}</h3>
<span style="font-family: 'Instrument Sans', system-ui, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #4B4740">{{resultCount}}</span>
</div>
<div style="border-top: 2px solid #111111">
<sc-for list="{{items}}" as="it" hint-placeholder-count="6">
<a href="{{it.href}}" style="display: flex; flex-wrap: wrap; gap: 8px 22px; align-items: center; padding: 18px 4px; border-bottom: 2px solid #111111">
<div style="display: flex; flex-direction: column; gap: 2px; min-width: 120px">
<span style="font-family: 'Instrument Sans', system-ui, sans-serif; font-size: 13px; font-weight: 700">{{it.day}}</span>
<span style="font-family: 'Instrument Sans', system-ui, sans-serif; font-size: 12px; color: #4B4740">{{it.time}}</span>
</div>
<div style="display: flex; flex-direction: column; gap: 4px; flex: 1 1 300px; min-width: 0">
<span style="font-family: 'Bricolage Grotesque', 'Instrument Sans', system-ui, sans-serif; font-weight: 800; font-size: 27px; line-height: 1.08">{{it.t}}</span>
<span style="font-size: 14px; color: #4B4740">{{it.where}} · {{it.kind}}</span>
</div>
<sc-if value="{{it.isOpen}}" hint-placeholder-val="{{ true }}">
<span style="border: 2px solid #111111; background: {{accent2}}; color: #FFFFFF; border-radius: 999px; padding: 4px 12px; font-size: 13px; font-weight: 700">{{it.status}}</span>
</sc-if>
<sc-if value="{{it.isClosed}}" hint-placeholder-val="{{ false }}">
<span style="border: 2px dashed #4B4740; color: #4B4740; border-radius: 999px; padding: 4px 12px; font-size: 13px; font-weight: 700">{{it.status}}</span>
</sc-if>
</a>
</sc-for>
</div>
<sc-if value="{{noItems}}" hint-placeholder-val="{{ false }}">
<div style="border: 2px dashed #111111; border-radius: 22px; padding: 24px; display: flex; flex-direction: column; gap: 10px; align-items: flex-start">
<h3 style="margin: 0; font-family: 'Bricolage Grotesque', 'Instrument Sans', system-ui, sans-serif; font-weight: 800; font-size: 28px; line-height: 1.05; letter-spacing: -0.02em; color: #111111">Nothing matches yet.</h3>
<span style="font-size: 16px">Try fewer filters, or check the live calendar.</span>
<a href="https://tinkerhub.org/events" style="display: inline-flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 26px; border-radius: 999px; font-weight: 700; font-size: 16px; box-sizing: border-box; border: 2px solid #111111; background: transparent; color: #111111">Live calendar →</a>
</div>
</sc-if>
</div>
</div>
</section>

<!-- C · CAMPUS NETWORK -->
<section id="campuses" style="background: #111111; color: #FAF7F0; border-bottom: 2px solid #111111">
<div style="max-width: 1280px; margin: 0 auto; padding-left: clamp(20px, 4vw, 56px); padding-right: clamp(20px, 4vw, 56px); box-sizing: border-box; padding-top: clamp(72px, 9vw, 120px); padding-bottom: clamp(72px, 9vw, 120px); display: flex; flex-direction: column; gap: 36px">
<div style="display: flex; flex-wrap: wrap; gap: 20px 48px; align-items: flex-end; justify-content: space-between">
<div style="display: flex; flex-direction: column; gap: 18px; flex: 1 1 620px; min-width: 0">
<span style="align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 999px; font-weight: 700; font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase; background: {{accent}}; color: #111111">Community · campus ecosystem</span>
<h2 style="margin: 0; font-family: 'Bricolage Grotesque', 'Instrument Sans', system-ui, sans-serif; font-weight: 800; font-size: clamp(42px, 5.6vw, 84px); line-height: 1; letter-spacing: -0.035em; color: #FAF7F0">Is there a TinkerHub at <em style="color: {{accent}}">your college?</em></h2>
</div>
<p style="margin: 0; font-size: 18px; line-height: 1.6; color: #D8D2C7; max-width: 420px">Each point below is one of the 72 active campus communities, grouped by district. Search or pick a district.</p>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 24px">
<div style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 10px">
<div style="position: relative; height: clamp(440px, 46vw, 600px); border: 2px solid #3A3733; border-radius: 22px; overflow: hidden; background-color: #111111; background-image: linear-gradient(rgba(245,241,232,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(245,241,232,0.05) 1px, transparent 1px); background-size: 24px 24px">
<canvas ref="{{setNet}}" role="img" aria-label="Constellation map of Kerala: 72 points, one per active TinkerHub campus community, clustered by district. Ernakulam has the largest cluster with 17. Wayanad is shown as an empty ring. The full list is alongside." style="display: block; width: 100%; height: 100%; touch-action: pan-y"></canvas>
<sc-if value="{{netFailed}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 24px; text-align: center; color: #B9B2A6">The 3D network needs WebGL. The full campus list is alongside.</div>
</sc-if>
<span style="position: absolute; left: 14px; top: 12px; background: #FAF7F0; color: #111111; border-radius: 14px; padding: 6px 12px; font-size: 14px; font-weight: 600; max-width: 80%">{{netLabel}}</span>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px 22px; font-size: 13px; color: #D8D2C7">
<span style="display: inline-flex; align-items: center; gap: 8px"><span style="width: 10px; height: 10px; border-radius: 999px; background: {{accent}}; display: inline-block"></span>one point = one active campus community</span>
<span style="display: inline-flex; align-items: center; gap: 8px"><span style="width: 12px; height: 12px; border-radius: 999px; border: 2px solid #FAF7F0; display: inline-block"></span>district hub, placed near the district’s location</span>
<span style="display: inline-flex; align-items: center; gap: 8px"><span style="width: 12px; height: 12px; border-radius: 999px; border: 2px dashed {{accent2}}; display: inline-block; filter: brightness(1.8)"></span>no campus yet</span>
<span>Positions within a district are spread for legibility, not geographic.</span>
</div>
</div>
<div style="flex: 1 1 380px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
<label style="display: flex; flex-direction: column; gap: 8px">
<span style="font-family: 'Instrument Sans', system-ui, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #B9B2A6">College name or short name</span>
<input type="search" value="{{cq}}" onInput="{{onCQ}}" placeholder="Try MEC, CET or Thrissur" style="font-family: inherit; font-size: 17px; color: #111111; background: #FAF7F0; border: 2px solid #FAF7F0; border-radius: 14px; padding: 0 16px; min-height: 50px; box-sizing: border-box; width: 100%">
</label>
<div role="group" aria-label="District" style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{dChips}}" as="dc" hint-placeholder-count="15">
<sc-if value="{{dc.on}}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{dc.pick}}" aria-pressed="true" style="font-family: inherit; cursor: pointer; min-height: 36px; padding: 0 12px; border-radius: 999px; border: 2px solid {{accent}}; background: {{accent}}; color: #111111; font-weight: 700; font-size: 13px">{{dc.label}}</button></sc-if>
<sc-if value="{{dc.off}}" hint-placeholder-val="{{ true }}"><button type="button" onClick="{{dc.pick}}" aria-pressed="false" style="font-family: inherit; cursor: pointer; min-height: 36px; padding: 0 12px; border-radius: 999px; border: 2px solid #5A5650; background: transparent; color: #FAF7F0; font-weight: 600; font-size: 13px">{{dc.label}}</button></sc-if>
</sc-for>
</div>
<div style="background: #FAF7F0; color: #111111; border-radius: 22px; overflow: hidden">
<div style="display: flex; justify-content: space-between; align-items: baseline; padding: 14px 18px; border-bottom: 2px solid #111111">
<h3 style="margin: 0; font-family: 'Bricolage Grotesque', 'Instrument Sans', system-ui, sans-serif; font-weight: 800; font-size: 26px; line-height: 1.05; letter-spacing: -0.02em; color: #111111">{{cTitle}}</h3>
<span style="font-family: 'Instrument Sans', system-ui, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #4B4740">{{cCount}}</span>
</div>
<sc-if value="{{hasCampuses}}" hint-placeholder-val="{{ true }}">
<ul style="list-style: none; margin: 0; padding: 0; max-height: 360px; overflow-y: auto">
<sc-for list="{{campusList}}" as="c" hint-placeholder-count="6">
<li style="display: flex; justify-content: space-between; gap: 12px; align-items: center; padding: 12px 18px; border-bottom: 1px solid #D9D1C1">
<span style="display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="font-weight: 600; font-size: 15px; line-height: 1.35">{{c.name}}</span><span style="font-size: 13px; color: #4B4740">{{c.district}}</span></span>
<sc-if value="{{c.hasAlias}}" hint-placeholder-val="{{ true }}"><span style="flex-shrink: 0; font-family: 'Instrument Sans', system-ui, sans-serif; font-size: 11px; font-weight: 700; border: 2px solid #111111; border-radius: 10px; padding: 2px 6px">{{c.alias}}</span></sc-if>
</li>
</sc-for>
</ul>
</sc-if>
<sc-if value="{{noCampuses}}" hint-placeholder-val="{{ false }}">
<div style="padding: 22px 18px; display: flex; flex-direction: column; gap: 12px; align-items: flex-start">
<h3 style="margin: 0; font-family: 'Bricolage Grotesque', 'Instrument Sans', system-ui, sans-serif; font-weight: 800; font-size: 28px; line-height: 1.05; letter-spacing: -0.02em; color: #111111">No TinkerHub here yet.</h3>
<span style="font-size: 15px; line-height: 1.55">That means you could start it. Bring three friends; we train your core team and help plan your first build.</span>
<a href="https://airtable.com/appdFV7VvqOIlQ36v/shrKV8t5K5JgtfUOj" style="display: inline-flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 26px; border-radius: 999px; font-weight: 700; font-size: 16px; box-sizing: border-box; border: 2px solid #111111; background: {{accent}}; color: #111111; box-shadow: 4px 4px 0 #111111">Start a campus community →</a>
</div>
</sc-if>
</div>
</div>
</div>
</div>
</section>
<footer style="background: #111111; color: #CFC8BC">
<div style="max-width: 1280px; margin: 0 auto; padding-left: clamp(20px, 4vw, 56px); padding-right: clamp(20px, 4vw, 56px); box-sizing: border-box; padding-top: 64px; padding-bottom: 36px; display: flex; flex-wrap: wrap; gap: 48px; justify-content: space-between">

<div style="display: flex; flex-direction: column; gap: 10px; min-width: 150px">
<span style="font-family: 'Instrument Sans', system-ui, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #9C958A">Explore</span>

</div>

<span style="font-family: 'Instrument Sans', system-ui, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #9C958A">Our work</span>
<a href="impact.html" style="color: #FAF7F0; font-size: 15px">Impact</a>

  }
  renderVals() {

    }).sort((a, b) => a.closed === b.closed ? (a.closed ? b.ts - a.ts : a.ts - b.ts) : (a.closed ? 1 : -1)).map((x) => {

    });
