<!-- A · HERO -->
<section id="top" style="background: #111111; color: #FAF7F0; border-bottom: 2px solid #111111; position: relative; overflow: hidden">
<div style="max-width: 1280px; margin: 0 auto; padding-left: clamp(20px, 4vw, 56px); padding-right: clamp(20px, 4vw, 56px); box-sizing: border-box; padding-top: clamp(40px, 5vw, 72px); padding-bottom: clamp(48px, 6vw, 88px); display: flex; flex-wrap: wrap; gap: 24px 40px; align-items: center">
<div style="flex: 1 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 28px; position: relative; z-index: 1">
<span style="align-self: flex-start; background: {{accent}}; color: #111111; border-radius: 999px; padding: 6px 14px; font-weight: 700; font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase">Free · student-run · Kerala</span>
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', 'Instrument Sans', system-ui, sans-serif; font-weight: 800; font-size: clamp(56px, 8.6vw, 136px); line-height: 0.95; letter-spacing: -0.04em">Start building <span style="color: {{accent}}">before</span> you <em style="font-style: normal; background: #FFD23F; color: #111111; padding: 0 0.18em; border-radius: 0.18em; box-decoration-break: clone; -webkit-box-decoration-break: clone">graduate.</em></h1>
<p style="margin: 0; font-size: clamp(18px, 1.5vw, 21px); line-height: 1.6; color: #D8D2C7; max-width: 560px">TinkerHub is a community where students learn tech by building real projects with friends, on campus, at hackathons and in open maker spaces.</p>
<div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: center">
<a href="events-community.html" style="display: inline-flex; align-items: center; min-height: 56px; padding: 0 28px; border-radius: 999px; font-weight: 700; font-size: 17px; background: {{accent}}; color: #111111; border: 2px solid #FAF7F0; box-shadow: 5px 5px 0 #FAF7F0">Find your way in →</a>
<a href="#projects" style="font-weight: 700; text-decoration: underline; text-underline-offset: 5px">See what students build</a>
</div>
</div>
<div style="flex: 1 1 520px; min-width: 0; position: relative; height: clamp(420px, 46vw, 660px)">
<canvas ref="{{setHero}}" role="img" aria-label="A floating workshop of maker objects orbiting a growing spiral tower of blocks: gears, a circuit board, a little robot and wireframe shapes, with drifting particles of light" style="display: block; width: 100%; height: 100%; cursor: grab; touch-action: pan-y"></canvas>
<sc-if value="{{heroFailed}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; border: 2px dashed #5A5650; border-radius: 22px; color: #B9B2A6">TinkerHub workshop illustration</div>
</sc-if>
<span aria-hidden="true" style="position: absolute; top: 8%; left: 4%; transform: rotate(-6deg); background: #FFD23F; color: #111111; border-radius: 999px; padding: 6px 14px; font-weight: 800; font-size: 15px">ideas in motion</span>
<span aria-hidden="true" style="position: absolute; bottom: 10%; right: 4%; transform: rotate(5deg); background: {{accent2}}; color: #FFFFFF; border-radius: 999px; padding: 6px 14px; font-weight: 800; font-size: 15px">your project here</span>
</div>
</div>
</section>
<!-- HOW THE COMMUNITY WORKS (3D story) -->

</div>
<p style="margin: 0; font-size: 18px; line-height: 1.6; color: #D8D2C7; max-width: 420px">Five short scenes, no jargon. Let it play, or step through.</p>

<sc-if value="{{storyFailed}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 32px; text-align: center; color: #D8D2C7">The story on the right tells it all.</div>
</sc-if>
<span style="position: absolute; left: 18px; top: 16px; background: {{accent}}; color: #111111; font-weight: 800; font-size: 15px; padding: 6px 14px; border-radius: 999px; transform: rotate(-3deg)">Scene {{sceneNum}} / 5</span>
<span style="position: absolute; right: 18px; bottom: 14px; font-size: 13px; color: #B9B2A6">Drag to look around</span>
</div>
<div style="flex: 1 1 340px; min-width: 0; background: #FAF7F0; color: #111111; border-radius: 26px; padding: 30px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px">
<span style="font-weight: 700; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: #4B4740">{{scene.kicker}}</span>
<h3 style="margin: 0; font-family: 'Bricolage Grotesque', 'Instrument Sans', system-ui, sans-serif; font-weight: 800; font-size: clamp(30px, 2.8vw, 40px); line-height: 1.05; letter-spacing: -0.02em; color: #111111">{{scene.title}}</h3>
<p style="margin: 0; font-size: 18px; line-height: 1.55; color: #2C2925; flex-grow: 1">{{scene.body}}</p>
<div style="display: flex; gap: 8px; flex-wrap: wrap">
<sc-for list="{{dots}}" as="dot" hint-placeholder-count="5">
<sc-if value="{{dot.on}}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{dot.go}}" aria-label="{{dot.label}}" aria-current="step" style="font-family: inherit; cursor: pointer; width: 44px; height: 44px; border-radius: 999px; border: 2px solid #111111; background: {{accent}}; color: #111111; font-weight: 800; font-size: 16px">{{dot.n}}</button></sc-if>
<sc-if value="{{dot.off}}" hint-placeholder-val="{{ true }}"><button type="button" onClick="{{dot.go}}" aria-label="{{dot.label}}" style="font-family: inherit; cursor: pointer; width: 44px; height: 44px; border-radius: 999px; border: 2px solid #111111; background: #FAF7F0; color: #111111; font-weight: 700; font-size: 16px">{{dot.n}}</button></sc-if>
</sc-for>
</div>
<div style="display: flex; gap: 10px; flex-wrap: wrap">
<button type="button" onClick="{{goPrev}}" style="font-family: inherit; cursor: pointer; min-height: 48px; padding: 0 18px; border-radius: 999px; border: 2px solid #111111; background: #FAF7F0; color: #111111; font-weight: 700; font-size: 15px">← Back</button>
<button type="button" onClick="{{togglePlay}}" style="font-family: inherit; cursor: pointer; min-height: 48px; padding: 0 18px; border-radius: 999px; border: 2px solid #111111; background: #FAF7F0; color: #111111; font-weight: 700; font-size: 15px">{{playLabel}}</button>
<button type="button" onClick="{{goNext}}" style="font-family: inherit; cursor: pointer; min-height: 48px; padding: 0 22px; border-radius: 999px; border: 2px solid #111111; background: #111111; color: #FAF7F0; font-weight: 700; font-size: 15px; box-shadow: 4px 4px 0 {{accent}}">Next →</button>
</div>
</div>
</div>
</div>
</section>

    if (window.ResizeObserver) { ro = new ResizeObserver(resize); ro.observe(canvas); }
    if (window.IntersectionObserver) { io = new IntersectionObserver((es) => { st.visible = es[0].isIntersecting; }); io.observe(canvas); }
    const cA = new T.Color(), cB = new T.Color();
    const loop = () => {
      if (owner.disposed) return;
      st.raf = requestAnimationFrame(loop);
      const dt = Math.min(st.clock.getDelta(), 0.05);
      if (!st.visible) return;
      cA.set(owner.props.accent ?? "#FF5A36");
      cB.set(owner.props.accent2 ?? "#2346C8");
      st.acc.forEach((m) => m.color.copy(cA));
      st.acc2.forEach((m) => m.color.copy(cB));
      if (st.update) st.update(dt, st.clock.elapsedTime);
      renderer.render(scene, camera);
    };
    st.start = () => loop();
    owner.disposers.push(() => {
      cancelAnimationFrame(st.raf);
      if (ro) ro.disconnect();
      if (io) io.disconnect();
      scene.traverse((o) => {
        if (o.geometry) o.geometry.dispose();
        if (o.material) (Array.isArray(o.material) ? o.material : [o.material]).forEach((m) => m.dispose());

  mat(st, color, role) {

    if (role === "b") st.acc2.push(m);

  },
  solid(st, geo, color, role) {

  },
  wire(st, geo, role) {

    if (role === "a") st.acc.push(lm);

  },
  pointer(owner, el, h) {
    const rel = (e) => { const r = el.getBoundingClientRect(); return { x: ((e.clientX - r.left) / r.width) * 2 - 1, y: -((e.clientY - r.top) / r.height) * 2 + 1, cx: e.clientX }; };
    const mv = (e) => h.move && h.move(rel(e), e);
    const dn = (e) => h.down && h.down(rel(e), e);
    const lv = (e) => h.leave && h.leave(e);
    const up = (e) => h.up && h.up(e);
    el.addEventListener("pointermove", mv);
    el.addEventListener("pointerdown", dn);
    el.addEventListener("pointerleave", lv);
    window.addEventListener("pointerup", up);
    owner.disposers.push(() => { el.removeEventListener("pointermove", mv); el.removeEventListener("pointerdown", dn); el.removeEventListener("pointerleave", lv); window.removeEventListener("pointerup", up); });
  },
  gear(st, r, teeth, depth, color, role) {
    const T = st.T, sh = new T.Shape(), step = Math.PI * 2 / teeth;
    for (let i = 0; i < teeth; i++) {
      const a = i * step;
      [[r, a], [r + 0.3, a + step * 0.15], [r + 0.3, a + step * 0.45], [r, a + step * 0.6]].forEach((q, k) => {
        const x = Math.cos(q[1]) * q[0], y = Math.sin(q[1]) * q[0];
        if (i === 0 && k === 0) sh.moveTo(x, y); else sh.lineTo(x, y);
      });
    }
    sh.closePath();
    const hole = new T.Path();
    hole.absarc(0, 0, r * 0.36, 0, Math.PI * 2, true);
    sh.holes.push(hole);
    const g = new T.ExtrudeGeometry(sh, { depth: depth, bevelEnabled: false, curveSegments: 12 });

    return TK.solid(st, g, color, role);
  },
  robot(st) {
    const T = st.T, g = new T.Group();
    const body = TK.solid(st, new T.BoxGeometry(0.9, 0.85, 0.7), 0xf5f1e8); body.position.y = 0.95; g.add(body);
    const head = TK.solid(st, new T.BoxGeometry(0.66, 0.52, 0.54), 0x2346c8, "b"); head.position.y = 1.68; g.add(head);
    [-0.15, 0.15].forEach((x) => { const e = TK.solid(st, new T.BoxGeometry(0.12, 0.1, 0.05), 0xff5a36, "a"); e.position.set(x, 1.72, 0.28); g.add(e); });
    [-0.62, 0.62].forEach((x) => { const a = TK.solid(st, new T.BoxGeometry(0.22, 0.7, 0.22), 0xff5a36, "a"); a.position.set(x, 1.0, 0); g.add(a); });
    [-0.22, 0.22].forEach((x) => { const l = TK.solid(st, new T.BoxGeometry(0.26, 0.55, 0.26), 0x9a958c); l.position.set(x, 0.28, 0); g.add(l); });
    const ant = TK.solid(st, new T.CylinderGeometry(0.04, 0.04, 0.35, 6), 0x111111); ant.position.y = 2.1; g.add(ant);
    const tip = TK.solid(st, new T.SphereGeometry(0.1, 10, 8), 0xffe15a); tip.position.y = 2.32; g.add(tip);
    return g;
  },
  board(st) {
    const T = st.T, g = new T.Group();
    g.add(TK.solid(st, new T.BoxGeometry(2.0, 0.12, 1.3), 0x2346c8, "b"));
    const chip = TK.solid(st, new T.BoxGeometry(0.6, 0.12, 0.6), 0x111111); chip.position.set(-0.3, 0.12, 0); g.add(chip);
    const pinGeo = new T.BoxGeometry(0.08, 0.16, 0.08), pinMat = new T.MeshToonMaterial({ color: 0xf5f1e8 });
    for (let i = 0; i < 7; i++) { const pin = new T.Mesh(pinGeo, pinMat); pin.position.set(-0.85 + i * 0.27, 0.13, 0.5); g.add(pin); }
    const led = TK.solid(st, new T.CylinderGeometry(0.12, 0.12, 0.28, 10), 0xff5a36, "a"); led.position.set(0.6, 0.2, -0.2); g.add(led);
    return g;
  },
  lerp(a, b, k) { return a + (b - a) * k; },
  ease(t) { t = Math.max(0, Math.min(1, t)); return 1 - Math.pow(1 - t, 3); }
};

class Component extends DCLogic {

    TK.whenThree(this, (T) => {
      if (!T) { this.setState({ heroFailed: true, procFailed: true, storyFailed: true }); return; }
      try { this.initHero(T); } catch (e) { this.setState({ heroFailed: true }); }
      TK.lazy(this, this.storyEl, () => { try { this.initScene(); } catch (e) { this.setState({ storyFailed: true }); } });
      TK.lazy(this, this.closeEl, () => { try { this.initClose(T); } catch (e) {} });
    });
  }

  componentWillUnmount() {
    this.disposed = true;
    this.timers.forEach((t) => { clearTimeout(t); clearInterval(t); });
    if (this.raf) cancelAnimationFrame(this.raf);
    if (this.ro) this.ro.disconnect();
    if (this.offPointer) this.offPointer();
    if (this.renderer) this.renderer.dispose();
    this.disposers.forEach((f) => { try { f(); } catch (e) {} });
  }

  initScene() {
    const T = window.THREE;
    const canvas = this.storyEl;

    const sun = new T.DirectionalLight(0xffffff, 0.75);
    sun.position.set(6, 12, 8);
    scene.add(sun);
    const world = new T.Group();
    scene.add(world);

    const mat = (c) => new T.MeshStandardMaterial({ color: c, flatShading: true, roughness: 0.75 });
    const accentMats = [];
    const accent2Mats = [];
    const aMat = () => { const m = mat(0xffd23f); accentMats.push(m); return m; };
    const bMat = () => { const m = mat(0x2b4eff); accent2Mats.push(m); return m; };
    const items = [];
    const add = (obj, targets) => { world.add(obj); items.push({ o: obj, t: targets }); return obj; };
    const same = (x, y, z, s) => [[x, y, z, s], [x, y, z, s], [x, y, z, s], [x, y, z, s], [x, y, z, s]];

    // ground
    const ground = new T.Mesh(new T.CircleGeometry(40, 64), mat(0x1d1d24));

    add(campus, [[0, 0.02, 0, 0.001], [0, 0.02, 0, 1], [0, 0.02, 0, 1], [0, 0.02, 0, 1.6], [0, 0.02, 0, 1.6]]);

    const spot = new T.Mesh(new T.CircleGeometry(0.9, 32), new T.MeshBasicMaterial({ color: 0xffd23f, transparent: true, opacity: 0.25 }));

    add(spot, [[0, 0.03, 0, 1], [0, 0.03, R, 0.001], [0, 0.03, R, 0.001], [0, 0.03, R, 0.001], [0, 0.03, R, 0.001]]);

    // peers on campus
    for (let i = 0; i < 6; i++) {

      const m = i % 2 ? mat(0xe9e6df) : bMat();
      add(person(m), [[x, 3, z, 0.001], [x, 0, z, 1.1], [x, 0, z, 1.1], [x, 0, z, 1.1], [x, 0, z, 1.1]]);
    }
    const ring = new T.Mesh(new T.TorusGeometry(R, 0.035, 8, 80), bMat());
    ring.rotation.x = Math.PI / 2;
    add(ring, [[0, 0.12, 0, 0.001], [0, 0.12, 0, 1], [0, 0.12, 0, 1], [0, 0.12, 0, 1], [0, 0.12, 0, 1]]);

    // robot assembled from blocks
    let seed = 7;
    const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
    const parts = [
      [[0.9, 0.85, 0.7], mat(0xe9e6df), 0, 0.95, 0],
      [[0.62, 0.5, 0.52], bMat(), 0, 1.68, 0],
      [[0.12, 0.1, 0.05], aMat(), -0.14, 1.72, 0.27],
      [[0.12, 0.1, 0.05], aMat(), 0.14, 1.72, 0.27],
      [[0.22, 0.7, 0.22], aMat(), -0.62, 1.0, 0],
      [[0.22, 0.7, 0.22], aMat(), 0.62, 1.0, 0],
      [[0.26, 0.55, 0.26], mat(0x9a9aa6), -0.22, 0.28, 0],
      [[0.26, 0.55, 0.26], mat(0x9a9aa6), 0.22, 0.28, 0],
      [[0.06, 0.35, 0.06], mat(0x9a9aa6), 0, 2.08, 0],
      [[0.14, 0.14, 0.14], aMat(), 0, 2.3, 0]
    ];
    parts.forEach((p) => {
      const mesh = new T.Mesh(new T.BoxGeometry(p[0][0], p[0][1], p[0][2]), p[1]);

    const pulses = [];

      const a = -1.0 + i * (2.0 / 6);

      add(person(mat(0xd8d6e6)), [[x, 0, z, 0.001], [x, 0, z, 0.001], [x, 0, z, 0.001], [x, 0, z, 1], [x, 0, z, 1]]);
      const lm = new T.LineBasicMaterial({ color: 0xffd23f, transparent: true, opacity: 0 });

      lineMats.push(lm);
      const geo = new T.BufferGeometry().setFromPoints([new T.Vector3(hx, 0.6, hz), new T.Vector3(x, 0.6, z)]);

    // the movement: campuses across a long, narrow band (like Kerala)
    const clusters = [];
    let tries = 0;
    while (clusters.length < 26 && tries < 2000) {
      tries++;
      const zz = (rnd() - 0.5) * 50;
      const xx = (rnd() - 0.5) * 14 - zz * 0.22;
      if (Math.hypot(xx, zz) < 8) continue;
      if (clusters.some((c) => Math.hypot(c[0] - xx, c[1] - zz) < 4.2)) continue;
      clusters.push([xx, zz]);
    }
    const netMat = new T.LineBasicMaterial({ color: 0x2b4eff, transparent: true, opacity: 0 });
    accent2Mats.push(netMat);
    const pts = [];
    const all = [[0, 0]].concat(clusters);

      const near = all.map((d, j) => [Math.hypot(d[0] - c[0], d[1] - c[1]), j]).filter((d) => d[1] !== i).sort((p, q) => p[0] - q[0]).slice(0, 2);
      near.forEach((n) => { const d = all[n[1]]; pts.push(new T.Vector3(c[0], 0.3, c[1]), new T.Vector3(d[0], 0.3, d[1])); });

    world.add(new T.LineSegments(new T.BufferGeometry().setFromPoints(pts), netMat));
    clusters.forEach((c) => {

        const pp = person(k === 0 ? aMat() : (k === 1 ? bMat() : mat(0xe9e6df)));

      g.add(beacon);
      add(g, [[c[0], -2, c[1], 0.001], [c[0], -2, c[1], 0.001], [c[0], -2, c[1], 0.001], [c[0], -2, c[1], 0.001], [c[0], 0, c[1], 1]]);
    });

    const cams = [
      [[0, 2.4, 6.8], [0, 0.8, 0]],
      [[0, 5.2, 9.6], [0, 0.6, 0.3]],
      [[3.6, 3.6, 7.4], [0, 1.1, 0.6]],
      [[0, 7.5, 13.5], [0, 0.4, 2.4]],
      [[0, 36, 34], [0, 0, -1]]
    ];
    items.forEach((it) => { const v = it.t[0]; it.o.position.set(v[0], v[1], v[2]); it.o.scale.setScalar(v[3]); });
    const camPos = new T.Vector3(...cams[0][0]);
    const camLook = new T.Vector3(...cams[0][1]);
    camera.position.copy(camPos);

    const resize = () => {
      const w = canvas.clientWidth || 600, h = canvas.clientHeight || 400;

    if (window.ResizeObserver) { this.ro = new ResizeObserver(resize); this.ro.observe(canvas); }

    // drag to rotate
    let dragging = false, lastX = 0, spin = 0;
    const down = (e) => { dragging = true; lastX = e.clientX; canvas.style.cursor = 'grabbing'; };
    const move = (e) => { if (!dragging) return; spin += (e.clientX - lastX) * 0.008; lastX = e.clientX; };
    const up = () => { dragging = false; canvas.style.cursor = 'grab'; };

      const time = clock.elapsedTime;
      const s = this.state.scene;
      const k = this.reduce ? 1 : 1 - Math.exp(-dt * 3.2);
      tmpA.set(this.props.accent ?? '#FF5A36');
      tmpB.set(this.props.accent2 ?? '#2346C8');
      accentMats.forEach((m) => m.color.copy(tmpA));
      accent2Mats.forEach((m) => m.color.copy(tmpB));
      items.forEach((it) => {
        const v = it.t[s];
        it.o.position.x += (v[0] - it.o.position.x) * k;
        it.o.position.y += (v[1] - it.o.position.y) * k;
        it.o.position.z += (v[2] - it.o.position.z) * k;
        const sc = it.o.scale.x + (v[3] - it.o.scale.x) * k;
        it.o.scale.setScalar(Math.max(sc, 0.001));

        const u = this.reduce ? 0.5 : (time * 0.5 + p.off) % 1;

      if (!dragging && !this.reduce) spin += dt * 0.06;
      world.rotation.y += (spin - world.rotation.y) * (this.reduce ? 1 : 0.15);
      const c = cams[s];
      camPos.lerp(new T.Vector3(c[0][0], c[0][1], c[0][2]), k * 0.7);
      camLook.lerp(new T.Vector3(c[1][0], c[1][1], c[1][2]), k * 0.7);
      camera.position.copy(camPos);
      camera.lookAt(camLook);
      renderer.render(scene, camera);
    };
    loop();
  }



  initHero(T) {
    if (!this.heroEl) return;
    const st = TK.stage(T, this.heroEl, this, 32);
    const { scene, camera } = st;
    camera.position.set(0, 0.6, 19);
    camera.lookAt(0, 0.2, 0);
    const root = new T.Group();
    scene.add(root);

    // the central, evolving structure: a spiral tower of blocks
    const tower = new T.Group();
    root.add(tower);
    const palette = [[0xff5a36, "a"], [0x2346c8, "b"], [0xf5f1e8, null], [0xffe15a, null], [0x111111, null]];
    const N = st.low ? 22 : 34;
    const bgeo = new T.BoxGeometry(0.62, 0.42, 0.62);
    const blocks = [];
    for (let i = 0; i < N; i++) {
      const c = palette[i % palette.length];
      const m = TK.solid(st, bgeo, c[0], c[1]);
      const a = i * 0.62, r = 1.15 + 0.14 * Math.sin(i * 0.7);
      m.position.set(Math.cos(a) * r, -2.8 + i * 0.17, Math.sin(a) * r);
      m.rotation.y = -a;
      m.scale.setScalar(st.reduce ? 1 : 0.001);
      tower.add(m);
      blocks.push({ m: m, born: 0.3 + i * 0.09 });
    }
    const core = TK.solid(st, new T.IcosahedronGeometry(0.55, 0), 0xff5a36, "a");
    core.position.y = -2.8 + N * 0.17 + 0.6;
    tower.add(core);

    // orbits with riders
    const rings = [];
    const ringDefs = [[3.4, 0.35, 0.2], [4.3, -0.5, -0.3], [5.2, 0.15, 0.7]];
    ringDefs.forEach((d) => {
      const g = new T.Group();
      g.rotation.set(d[1], 0, d[2]);
      const ring = new T.Mesh(new T.TorusGeometry(d[0], 0.014, 6, 140), new T.MeshBasicMaterial({ color: 0x5a5650 }));
      ring.rotation.x = Math.PI / 2;
      g.add(ring);
      root.add(g);
      rings.push({ g: g, r: d[0], riders: [] });
    });
    const addRider = (ri, obj, a0, speed) => { rings[ri].g.add(obj); rings[ri].riders.push({ o: obj, a: a0, s: speed }); };
    const gear = TK.gear(st, 0.42, 10, 0.18, 0xffe15a); addRider(0, gear, 0.4, 0.22);
    const brd = TK.board(st); brd.scale.setScalar(0.45); addRider(0, brd, 3.4, 0.22);
    const bot = TK.robot(st); bot.scale.setScalar(0.42); addRider(1, bot, 1.2, -0.16);
    const ico = TK.wire(st, new T.IcosahedronGeometry(0.6, 1), "b"); addRider(1, ico, 4.2, -0.16);
    const cone = TK.solid(st, new T.ConeGeometry(0.35, 0.7, 5), 0xff5a36, "a"); addRider(2, cone, 0.0, 0.12);
    const knot = TK.solid(st, new T.TorusKnotGeometry(0.32, 0.1, 64, 8), 0xf5f1e8); addRider(2, knot, 2.2, 0.12);
    const cube = TK.wire(st, new T.BoxGeometry(0.8, 0.8, 0.8), "b"); addRider(2, cube, 4.4, 0.12);

    // sketch stars (hand-drawn sparkle outlines)
    const starShape = (s) => { const pts = []; for (let i = 0; i <= 8; i++) { const a = i * Math.PI / 4; const r = i % 2 ? s * 0.28 : s; pts.push(new T.Vector3(Math.cos(a) * r, Math.sin(a) * r, 0)); } return new T.BufferGeometry().setFromPoints(pts); };
    const stars = [];
    [[-5.2, 3.2, -1], [5.4, 2.6, -2], [-4.4, -3.1, 0.5], [4.8, -2.9, 1], [0.6, 4.4, -2]].forEach((q, i) => {
      const line = new T.Line(starShape(0.32 + (i % 2) * 0.1), new T.LineBasicMaterial({ color: i % 2 ? 0xffd23f : 0xfaf7f0 }));
      line.position.set(q[0], q[1], q[2]);
      root.add(line);
      stars.push(line);
    });

    // particles: ideas in motion
    const PN = st.low ? 120 : 260;
    const pos = new Float32Array(PN * 3);
    for (let i = 0; i < PN; i++) {
      const u = Math.random() * 2 - 1, th = Math.random() * Math.PI * 2, r = 3 + Math.random() * 3.4;
      const s = Math.sqrt(1 - u * u);
      pos[i * 3] = r * s * Math.cos(th); pos[i * 3 + 1] = r * u * 0.8; pos[i * 3 + 2] = r * s * Math.sin(th);
    }
    const pg = new T.BufferGeometry();
    pg.setAttribute("position", new T.BufferAttribute(pos, 3));
    const pm = new T.PointsMaterial({ color: 0xff5a36, size: 0.07, sizeAttenuation: true });
    st.acc.push(pm);
    const points = new T.Points(pg, pm);
    root.add(points);

    let px = 0, py = 0, dragging = false, lastX = 0, spin = 0;
    TK.pointer(this, this.heroEl, {
      move: (r, e) => { px = r.x; py = r.y; if (dragging) { spin += (e.clientX - lastX) * 0.008; lastX = e.clientX; } },
      down: (r, e) => { dragging = true; lastX = e.clientX; },
      up: () => { dragging = false; },
      leave: () => { px = 0; py = 0; }
    });

    st.update = (dt, t) => {
      const rect = this.heroEl.getBoundingClientRect();
      const prog = Math.max(0, Math.min(1, -rect.top / Math.max(rect.height, 1)));
      if (!st.reduce) {
        blocks.forEach((b) => { const k = TK.ease((t - b.born) / 0.6); b.m.scale.setScalar(Math.max(k, 0.001)); });
        tower.rotation.y += dt * 0.16;
        core.rotation.x += dt * 0.6; core.rotation.y += dt * 0.9;
        rings.forEach((rg) => rg.riders.forEach((rd) => { rd.a += rd.s * dt; }));
        points.rotation.y += dt * 0.025;
        stars.forEach((s, i) => { s.rotation.z += dt * (i % 2 ? 0.3 : -0.25); });
        if (!dragging) spin *= 0.97;
      }
      rings.forEach((rg, i) => {
        rg.g.scale.setScalar(1 + prog * (0.25 + i * 0.12));
        rg.riders.forEach((rd) => { rd.o.position.set(Math.cos(rd.a) * rg.r, 0, Math.sin(rd.a) * rg.r); if (!st.reduce) { rd.o.rotation.y += dt * 0.6; rd.o.rotation.x += dt * 0.25; } });
      });
      tower.position.y = prog * 1.4;
      camera.position.z = 19 + prog * 3;
      root.rotation.y += ((px * 0.3 + spin) - root.rotation.y) * 0.07;
      root.rotation.x += ((-py * 0.14) - root.rotation.x) * 0.07;
    };
    st.start();
  }

  initClose(T) {
    if (!this.closeEl) return;
    const st = TK.stage(T, this.closeEl, this, 34);
    const { scene, camera } = st;
    camera.position.set(0, 0.4, 9.5);
    camera.lookAt(0, 0, 0);
    const g = new T.Group();
    scene.add(g);
    const N = st.low ? 26 : 40;
    const geos = [new T.BoxGeometry(0.3, 0.3, 0.3), new T.TetrahedronGeometry(0.22), new T.OctahedronGeometry(0.2), new T.SphereGeometry(0.16, 10, 8)];
    const cols = [[0xff5a36, "a"], [0x2346c8, "b"], [0xf5f1e8, null], [0xffe15a, null]];
    const nodes = [];
    const targets = [];
    const golden = Math.PI * (3 - Math.sqrt(5));
    for (let i = 0; i < N; i++) {
      const y = 1 - (i / (N - 1)) * 2, r = Math.sqrt(1 - y * y), th = golden * i;
      targets.push(new T.Vector3(Math.cos(th) * r * 2.3, y * 2.3, Math.sin(th) * r * 2.3));
    }
    for (let i = 0; i < N; i++) {
      const c = cols[i % 4];
      const m = TK.solid(st, geos[i % 4], c[0], c[1]);
      const from = new T.Vector3((Math.random() - 0.5) * 12, (Math.random() - 0.5) * 7, (Math.random() - 0.5) * 6);
      m.position.copy(st.reduce ? targets[i] : from);
      g.add(m);
      nodes.push({ m: m, from: from, to: targets[i], delay: i * 0.035 });
    }
    const lp = [];
    targets.forEach((a, i) => {
      targets.map((b, j) => [a.distanceTo(b), j]).filter((d) => d[1] !== i).sort((p, q) => p[0] - q[0]).slice(0, 2).forEach((d) => lp.push(a, targets[d[1]]));
    });
    const lm = new T.LineBasicMaterial({ color: 0x111111, transparent: true, opacity: st.reduce ? 0.55 : 0 });
    g.add(new T.LineSegments(new T.BufferGeometry().setFromPoints(lp), lm));
    st.update = (dt, t) => {
      if (st.reduce) return;
      nodes.forEach((n) => {
        const k = TK.ease((t - n.delay) / 2.2);
        n.m.position.lerpVectors(n.from, n.to, k);
        n.m.rotation.x += dt * 0.5; n.m.rotation.y += dt * 0.4;
      });
      lm.opacity = Math.min(0.55, Math.max(0, (t - 2.4) * 0.5));
      g.rotation.y += dt * 0.12;
    };
    st.start();
  }

  renderVals() {
    const accent = this.props.accent ?? "#FF5A36";
    const accent2 = this.props.accent2 ?? "#2346C8";
    const now = Date.now();
    const s = this.state.stage;
    const stages = this.stagesData.map((d, i) => ({ label: d.label, on: i === s, off: i !== s, go: () => this.setState({ stage: i, playing: false }) }));
    const feat = { n: "Supper Monkey", line: "A voice-first kitchen assistant for a visually impaired person. Hardware, built by a team of four.", tag: "Built for someone", at: "Claude Impact Lab · Calicut · 2026", bg: accent, fg: "#111111", href: "programs.html" };
    const minis = [
      { n: "Goofball", line: "An incompetent Magic 8-Ball with many personalities.", tag: "Useless on purpose", at: "Useless Projects 3.0", bg: "#FFE15A", href: "major-events.html" },
      { n: "Nirbhaya", line: "A women’s safety device with GPS, SMS alerts and fall detection.", tag: "Hardware", at: "Tink-Her-Hack 3.0", bg: accent2, href: "major-events.html" },
      { n: "The Ghats", line: "A pixel game about the Western Ghats’ endemic species.", tag: "Game", at: "Multispecies Hackathon", bg: "#111111", href: "programs.html" }
    ];
    const fmt = (d) => { const x = new Date(d); return x.toLocaleDateString("en-IN", { weekday: "short", day: "numeric", month: "short", timeZone: "Asia/Kolkata" }) + " · " + x.toLocaleTimeString("en-IN", { hour: "numeric", minute: "2-digit", timeZone: "Asia/Kolkata" }); };
    const nextUp = EVENTS.filter((e) => new Date(e.d).getTime() > now - 3 * 3600 * 1000).sort((a, b) => new Date(a.d) - new Date(b.d)).slice(0, 4)
      .map((e) => ({ t: e.t, when: fmt(e.d), where: e.where, kind: e.kind, href: e.link || "https://tinkerhub.org/events" }));
    const sd = this.stagesData[s];
    return {
      accent, accent2,
      setHero: this.setHero, setProc: this.setProc, setClose: this.setClose,
      heroFailed: this.state.heroFailed, procFailed: this.state.procFailed,
      feat, minis,
      nextUp, noNext: nextUp.length === 0,
      setStory: this.setStory, storyFailed: this.state.storyFailed,
      scene: this.scenes[this.state.scene], sceneNum: String(this.state.scene + 1),
      dots: this.scenes.map((sc, i) => ({ n: String(i + 1), label: "Scene " + (i + 1) + ": " + sc.title, on: i === this.state.scene, off: i !== this.state.scene, go: () => this.setState({ scene: i, playing: false }) })),
      playLabel: this.state.playing ? "Pause" : "Play",
      togglePlay: () => this.setState({ playing: !this.state.playing }),
      goPrev: () => this.setState({ scene: (this.state.scene + 4) % 5, playing: false }),
      goNext: () => this.setState({ scene: (this.state.scene + 1) % 5, playing: false })
    };
  }
}
TinkerRuntime.mount(Component, document.getElementById("page"), document.getElementById("app"), {"accent": "#FF5A36", "accent2": "#2346C8"});
</script>
</body>
