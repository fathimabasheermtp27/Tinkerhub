class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { mapHover: null, mapFailed: false };

    this.setMap = (el) => { this.mapEl = el; };
  }
  componentDidMount() {
    TK.whenThree(this, (T) => {

    });
  }
  componentWillUnmount() {
    this.disposed = true;
    this.timers.forEach((t) => clearTimeout(t));
    this.disposers.forEach((f) => { try { f(); } catch (e) {} });
  }
  initMap(T) {
    if (!this.mapEl) return;
    const st = TK.stage(T, this.mapEl, this, 40);
    const { scene, camera } = st;
    camera.position.set(0, 29, 12);
    camera.lookAt(1.2, 1, 1.2);
    const root = new T.Group();
    scene.add(root);
    const K = 4.2;
    const toXZ = (lon, lat) => [(lon - 76.1) * K, -(lat - 10.5) * K];
    const border = [[74.95, 12.75], [75.15, 12.2], [75.35, 11.8], [75.65, 11.4], [75.85, 11.0], [76.0, 10.6], [76.1, 10.2], [76.2, 9.9], [76.3, 9.5], [76.4, 9.1], [76.55, 8.8], [76.85, 8.45], [77.1, 8.25], [77.25, 8.5], [77.2, 9.0], [77.3, 9.5], [77.25, 9.9], [77.2, 10.2], [76.85, 10.45], [76.9, 10.8], [76.7, 11.2], [76.4, 11.6], [76.0, 11.95], [75.6, 12.3], [75.3, 12.8]];
    const sh = new T.Shape();
    border.forEach((b, i) => { const q = toXZ(b[0], b[1]); if (i === 0) sh.moveTo(q[0], -q[1]); else sh.lineTo(q[0], -q[1]); });
    sh.closePath();
    const landGeo = new T.ExtrudeGeometry(sh, { depth: 0.35, bevelEnabled: false });
    const land = new T.Mesh(landGeo, new T.MeshToonMaterial({ color: 0xf5f1e8 }));
    land.add(new T.LineSegments(new T.EdgesGeometry(landGeo, 20), st.ink));
    land.rotation.x = -Math.PI / 2;
    root.add(land);
    const sea = new T.Mesh(new T.PlaneGeometry(70, 70), new T.MeshBasicMaterial({ color: 0x1e1d1b }));
    sea.rotation.x = -Math.PI / 2; sea.position.y = -0.02;
    root.add(sea);
    const seaGrid = new T.GridHelper(70, 70, 0x2c2a27, 0x2c2a27);
    seaGrid.position.y = -0.01;
    root.add(seaGrid);
    const D = [["Kasaragod", 75.15, 12.45, 2], ["Kannur", 75.45, 11.95, 2], ["Wayanad", 76.1, 11.65, 0], ["Kozhikode", 75.85, 11.3, 5], ["Malappuram", 76.1, 11.05, 5], ["Palakkad", 76.6, 10.8, 3], ["Thrissur", 76.25, 10.5, 10], ["Ernakulam", 76.4, 10.05, 17], ["Idukki", 76.95, 9.85, 3], ["Kottayam", 76.65, 9.6, 6], ["Alappuzha", 76.45, 9.4, 6], ["Pathanamthitta", 76.85, 9.25, 3], ["Kollam", 76.7, 8.95, 4], ["Thiruvananthapuram", 76.95, 8.55, 6]];
    const cols = [];
    D.forEach((d) => {
      const q = toXZ(d[1], d[2]);
      const h = d[3] ? 0.5 + d[3] * 0.34 : 0.6;
      const geo = new T.CylinderGeometry(0.46, 0.46, h, 6);
      geo.translate(0, h / 2, 0);
      let m;
      if (d[3]) {
        m = TK.solid(st, geo, 0xff5a36, "a");
      } else {
        const lm = new T.LineBasicMaterial({ color: 0x2346c8 });
        st.acc2.push(lm);
        m = new T.Mesh(geo, new T.MeshBasicMaterial({ visible: false }));
        m.add(new T.LineSegments(new T.EdgesGeometry(geo, 20), lm));
      }
      m.position.set(q[0], 0.35, q[1]);
      m.scale.y = st.reduce ? 1 : 0.001;
      m.userData = { name: d[0], count: d[3] };
      root.add(m);
      cols.push(m);
    });
    const ray = new T.Raycaster();
    const ndc = new T.Vector2();

    TK.pointer(this, this.mapEl, {
      move: (r, e) => {
        if (dragging) { spin += (e.clientX - lastX) * 0.006; lastX = e.clientX; }
        ndc.set(r.x, r.y);
        ray.setFromCamera(ndc, camera);
        const hit = ray.intersectObjects(cols, false);
        const m = hit.length ? hit[0].object : null;

      },
      down: (r, e) => { dragging = true; lastX = e.clientX; },
      up: () => { dragging = false; }

      grown += dt;

  }
  renderVals() {

      accent: this.props.accent ?? "#FF5A36",
      accent2: this.props.accent2 ?? "#2346C8",

  }
}
