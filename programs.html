<sc-if value="{{pb.off}}" hint-placeholder-val="{{ true }}">

    const ndc = new T.Vector2();
    let hovered = null, px = 0;
    const pick = (r) => {
      ndc.set(r.x, r.y);
      ray.setFromCamera(ndc, camera);
      const h = ray.intersectObjects(objs.map((o) => o.hit), false);
      return h.length ? h[0].object.userData.id : null;
    };
    TK.pointer(this, this.playEl, {
      move: (r) => {
        px = r.x;
        const id = pick(r);
        if (id !== hovered) {
          hovered = id;
          this.playEl.style.cursor = id ? "pointer" : "default";
          this.setState({ hover: id });
        }
      },
      down: (r) => { const id = pick(r); if (id) this.setState({ prog: id }); },
      leave: () => { px = 0; if (hovered) { hovered = null; this.setState({ hover: null }); } }
    });
    st.update = (dt, t) => {
      const sel = this.state.prog;
      const k = st.reduce ? 1 : 1 - Math.exp(-dt * 8);
      objs.forEach((o, i) => {
        const active = o.id === sel, hov = o.id === hovered;
        const tl = active ? 0.35 : (hov ? 0.2 : 0);
        o.lift += (tl - o.lift) * k;
        o.g.position.y = o.lift + (st.reduce ? 0 : Math.sin(t * 1.4 + i) * 0.04);
        o.pad.material.opacity += ((active ? 0.9 : (hov ? 0.35 : 0)) - o.pad.material.opacity) * k;
        if (!st.reduce) {
          o.g.rotation.y += dt * (active ? 0.9 : (hov ? 0.6 : 0.12));
          if (o.g.userData.gears) { const gs = o.g.userData.gears; gs[0].rotation.z += dt * 0.8; gs[1].rotation.z -= dt * 1.25; gs[2].rotation.z -= dt * 1.3; }
          if (o.g.userData.bubble) { o.g.userData.bubble.position.y = 1.5 + ((t * 0.5) % 1) * 0.6; }
        }
      });
      table.rotation.y += ((px * 0.12) - table.rotation.y) * 0.06;
    };
    st.start();
  }
  renderVals() {
    const accent = this.props.accent ?? "#FF5A36";
    const accent2 = this.props.accent2 ?? "#2346C8";
    const prog = PROGS.find((p) => p.id === this.state.prog) || PROGS[0];
    const hp = PROGS.find((p) => p.id === this.state.hover);
    return {
      accent, accent2,
      setPlay: this.setPlay, playFailed: this.state.playFailed,
      prog: prog,
      hoverLabel: hp ? hp.name + " →" : "pick an object",
      progBtns: PROGS.map((p) => ({ short: p.short, on: p.id === prog.id, off: p.id !== prog.id, pick: () => this.setState({ prog: p.id }) }))
    };
  }
}
TinkerRuntime.mount(Component, document.getElementById("page"), document.getElementById("app"), {"accent": "#FF5A36", "accent2": "#2346C8"});
</script>
</body>
</html>
