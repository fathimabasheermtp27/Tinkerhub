<section id="archive" style="background: #FAF7F0; border-bottom: 2px solid #111111">

<div style="display: flex; flex-wrap: wrap; gap: 20px 48px; align-items: flex-end; justify-content: space-between">
<div style="display: flex; flex-direction: column; gap: 18px; flex: 1 1 620px; min-width: 0">
<span style="align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 999px; font-weight: 700; font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase; background: #111111; color: #FAF7F0">Publication archive</span>
<h2 style="margin: 0; font-family: 'Bricolage Grotesque', 'Instrument Sans', system-ui, sans-serif; font-weight: 800; font-size: clamp(42px, 5.6vw, 84px); line-height: 1; letter-spacing: -0.035em; color: #111111">Everything we’ve <em style="font-style: normal; background: #FFD23F; color: #111111; padding: 0 0.18em; border-radius: 0.18em; box-decoration-break: clone; -webkit-box-decoration-break: clone">put on record.</em></h2>
</div>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 20px 32px; align-items: flex-end">
<label style="display: flex; flex-direction: column; gap: 8px; flex: 1 1 280px; max-width: 420px"><span style="font-family: 'Instrument Sans', system-ui, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #4B4740">Search</span>
<input type="search" value="{{q}}" onInput="{{onQ}}" placeholder="Useless Projects, Kolaambi, 2025…" style="font-family: inherit; font-size: 17px; color: #111111; background: #FFFFFF; border: 2px solid #111111; border-radius: 14px; padding: 0 16px; min-height: 50px; box-sizing: border-box; width: 100%"></label>
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-family: 'Instrument Sans', system-ui, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #4B4740">Type</span>
<div role="group" aria-label="Type" style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{typeChips}}" as="tc" hint-placeholder-count="5">
<sc-if value="{{tc.on}}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{tc.pick}}" aria-pressed="true" style="font-family: inherit; cursor: pointer; min-height: 40px; padding: 0 14px; border-radius: 999px; border: 2px solid #111111; background: #111111; color: #FAF7F0; font-weight: 600; font-size: 14px">{{tc.label}}</button></sc-if>
<sc-if value="{{tc.off}}" hint-placeholder-val="{{ true }}"><button type="button" onClick="{{tc.pick}}" aria-pressed="false" style="font-family: inherit; cursor: pointer; min-height: 40px; padding: 0 14px; border-radius: 999px; border: 2px solid #111111; background: transparent; color: #111111; font-weight: 600; font-size: 14px">{{tc.label}}</button></sc-if>
</sc-for>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-family: 'Instrument Sans', system-ui, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #4B4740">Year</span>
<div role="group" aria-label="Year" style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{yearChips}}" as="yc" hint-placeholder-count="6">
<sc-if value="{{yc.on}}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{yc.pick}}" aria-pressed="true" style="font-family: inherit; cursor: pointer; min-height: 40px; padding: 0 14px; border-radius: 999px; border: 2px solid #111111; background: #111111; color: #FAF7F0; font-weight: 600; font-size: 14px">{{yc.label}}</button></sc-if>
<sc-if value="{{yc.off}}" hint-placeholder-val="{{ true }}"><button type="button" onClick="{{yc.pick}}" aria-pressed="false" style="font-family: inherit; cursor: pointer; min-height: 40px; padding: 0 14px; border-radius: 999px; border: 2px solid #111111; background: transparent; color: #111111; font-weight: 600; font-size: 14px">{{yc.label}}</button></sc-if>
</sc-for>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-family: 'Instrument Sans', system-ui, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #4B4740">View</span>
<div role="group" aria-label="View" style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{viewChips}}" as="vc" hint-placeholder-count="2">
<sc-if value="{{vc.on}}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{vc.pick}}" aria-pressed="true" style="font-family: inherit; cursor: pointer; min-height: 40px; padding: 0 14px; border-radius: 999px; border: 2px solid #111111; background: #111111; color: #FAF7F0; font-weight: 600; font-size: 14px">{{vc.label}}</button></sc-if>
<sc-if value="{{vc.off}}" hint-placeholder-val="{{ true }}"><button type="button" onClick="{{vc.pick}}" aria-pressed="false" style="font-family: inherit; cursor: pointer; min-height: 40px; padding: 0 14px; border-radius: 999px; border: 2px solid #111111; background: transparent; color: #111111; font-weight: 600; font-size: 14px">{{vc.label}}</button></sc-if>
</sc-for>
</div>
</div>
</div>
<div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-family: 'Instrument Sans', system-ui, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #4B4740">{{count}}</span>
</div>
<sc-if value="{{gridView}}" hint-placeholder-val="{{ true }}">
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 18px">
<sc-for list="{{items}}" as="it" hint-placeholder-count="6">
<a href="{{it.href}}" style="background: #FFFFFF; border: 2px solid #111111; border-radius: 22px; overflow: hidden; display: flex; flex-direction: column">
<span style="display: flex; justify-content: space-between; align-items: flex-end; padding: 14px 16px; min-height: 96px; box-sizing: border-box; background: {{it.bg}}; color: {{it.fg}}; border-bottom: 2px solid #111111">
<span style="font-family: 'Bricolage Grotesque', 'Instrument Sans', system-ui, sans-serif; font-weight: 800; font-size: 44px; line-height: 0.85">{{it.year}}</span>
<span style="font-family: 'Instrument Sans', system-ui, sans-serif; font-size: 11px; text-transform: uppercase">{{it.type}}</span>
</span>
<span style="padding: 16px; display: flex; flex-direction: column; gap: 8px; flex-grow: 1">
<span style="font-family: 'Bricolage Grotesque', 'Instrument Sans', system-ui, sans-serif; font-weight: 800; font-size: 24px; line-height: 1.1">{{it.t}}</span>
<span style="font-size: 14px; line-height: 1.5; color: #2C2925; flex-grow: 1">{{it.desc}}</span>
<span style="font-family: 'Instrument Sans', system-ui, sans-serif; font-size: 11px; color: #4B4740">{{it.dl}} · {{it.fmt}}</span>
</span>
</a>
</sc-for>
</div>
</sc-if>
<sc-if value="{{listView}}" hint-placeholder-val="{{ false }}">
<div style="overflow-x: auto; border: 2px solid #111111; border-radius: 14px; background: #FFFFFF">
<table style="width: 100%; min-width: 720px; border-collapse: collapse; font-size: 15px">
<caption style="text-align: left; padding: 12px 14px; font-weight: 600">Publications, newest first</caption>
<thead><tr><th scope="col" style="text-align: left; padding: 10px 14px; border-bottom: 2px solid #111111">Title</th><th scope="col" style="text-align: left; padding: 10px 14px; border-bottom: 2px solid #111111">Type</th><th scope="col" style="text-align: left; padding: 10px 14px; border-bottom: 2px solid #111111">Published</th><th scope="col" style="text-align: left; padding: 10px 14px; border-bottom: 2px solid #111111">Format</th></tr></thead>
<tbody>
<sc-for list="{{items}}" as="it" hint-placeholder-count="6">
<tr><td style="padding: 10px 14px; border-bottom: 1px solid #D9D1C1"><a href="{{it.href}}" style="text-decoration: underline; text-underline-offset: 3px; font-weight: 600">{{it.t}}</a></td><td style="padding: 10px 14px; border-bottom: 1px solid #D9D1C1">{{it.type}}</td><td style="padding: 10px 14px; border-bottom: 1px solid #D9D1C1; white-space: nowrap">{{it.dl}}</td><td style="padding: 10px 14px; border-bottom: 1px solid #D9D1C1">{{it.fmt}}</td></tr>
</sc-for>
</tbody>
</table>
</div>
</sc-if>
<sc-if value="{{noItems}}" hint-placeholder-val="{{ false }}">
<div style="border: 2px dashed #111111; border-radius: 22px; padding: 22px">Nothing matches. Try another search or filter.</div>
</sc-if>
</div>
</section>
