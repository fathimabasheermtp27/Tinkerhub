<section style="border-bottom: 2px solid #111111">
<div style="max-width: 1280px; margin: 0 auto; padding-left: clamp(20px, 4vw, 56px); padding-right: clamp(20px, 4vw, 56px); box-sizing: border-box; padding-top: clamp(64px, 8vw, 104px); padding-bottom: clamp(64px, 8vw, 104px); display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 40px">
<div style="display: flex; flex-direction: column; gap: 14px"><span style="font-family: 'Instrument Sans', system-ui, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: {{accent2}}">The problem</span>
<h3 style="margin: 0; font-family: 'Bricolage Grotesque', 'Instrument Sans', system-ui, sans-serif; font-weight: 800; font-size: clamp(30px, 3vw, 40px); line-height: 1.05; letter-spacing: -0.02em; color: #111111">Students can finish a degree without ever building something real.</h3>
<p style="margin: 0; font-size: 16px; line-height: 1.6; color: #2C2925; max-width: 640px">Hands-on projects, modern tools, mentors and teammates are unevenly available, especially outside large city colleges. Students who get them early tend to find their direction sooner.</p>
</div>
<div style="display: flex; flex-direction: column; gap: 14px"><span style="font-family: 'Instrument Sans', system-ui, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: {{accent2}}">The approach</span>
<h3 style="margin: 0; font-family: 'Bricolage Grotesque', 'Instrument Sans', system-ui, sans-serif; font-weight: 800; font-size: clamp(30px, 3vw, 40px); line-height: 1.05; letter-spacing: -0.02em; color: #111111">Peer learning, on campus and in open spaces.</h3>
<p style="margin: 0; font-size: 16px; line-height: 1.6; color: #2C2925; max-width: 640px">Student-run campus communities, free hackathons and programs, and two open maker spaces. Students learn by building with peers; those who learn teach the next group. It keeps costs low and lets the network grow itself.</p>
</div>
<div style="display: flex; flex-direction: column; gap: 14px"><span style="font-family: 'Instrument Sans', system-ui, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: {{accent2}}">The evidence</span>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px">
<div><span style="font-family: 'Bricolage Grotesque', 'Instrument Sans', system-ui, sans-serif; font-weight: 800; font-size: 44px; line-height: 1">26,005</span><br><span style="font-size: 13px; color: #4B4740">people took part in person</span></div>
<div><span style="font-family: 'Bricolage Grotesque', 'Instrument Sans', system-ui, sans-serif; font-weight: 800; font-size: 44px; line-height: 1">12,848</span><br><span style="font-size: 13px; color: #4B4740">people helped build a project</span></div>
<div><span style="font-family: 'Bricolage Grotesque', 'Instrument Sans', system-ui, sans-serif; font-weight: 800; font-size: 44px; line-height: 1">72</span><br><span style="font-size: 13px; color: #4B4740">active campus communities, 13 districts</span></div>
<div><span style="font-family: 'Bricolage Grotesque', 'Instrument Sans', system-ui, sans-serif; font-weight: 800; font-size: 44px; line-height: 1">59%</span><br><span style="font-size: 13px; color: #4B4740">of project contributors are women</span></div>

<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { name: "", email: "", org: "", kind: "Government or public institution", msg: "", sent: false, err: false };
    const set = (k) => (e) => this.setState({ [k]: e && e.target ? e.target.value : "", err: false });
    this.onName = set("name"); this.onEmail = set("email"); this.onOrg = set("org"); this.onKind = set("kind"); this.onMsg = set("msg");
    this.submit = () => {
      const ok = this.state.name.trim() && /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(this.state.email.trim());
      if (!ok) { this.setState({ err: true }); return; }
      this.setState({ sent: true });
    };
  }
  renderVals() {
    const s = this.state;
    return {
      accent: this.props.accent ?? "#FF5A36",
      accent2: this.props.accent2 ?? "#2346C8",
      f: { name: s.name, email: s.email, org: s.org, kind: s.kind, msg: s.msg, kindLower: s.kind.toLowerCase().replace("or ", "/ ") },
      onName: this.onName, onEmail: this.onEmail, onOrg: this.onOrg, onKind: this.onKind, onMsg: this.onMsg,
      submit: this.submit, sent: s.sent, notSent: !s.sent, showErr: s.err
    };
  }
}
TinkerRuntime.mount(Component, document.getElementById("page"), document.getElementById("app"), {"accent": "#FF5A36", "accent2": "#2346C8"});
</script>
